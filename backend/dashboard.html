<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>silentStack Command Center</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { margin: 0; color: #38bdf8; }
        .status-bar { font-size: 1.1em; color: #94a3b8; }
        .status-badge { background: #10b981; color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border-left: 6px solid #38bdf8; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); transition: all 0.3s; }
        .card.alert { border-left-color: #ef4444; animation: pulse 1s infinite alternate; }
        
        .val { font-size: 2.5em; font-weight: bold; margin: 15px 0 5px 0; color: #f1f5f9; }
        .label { color: #94a3b8; text-transform: uppercase; font-size: 0.85em; letter-spacing: 1.5px; font-weight: 600; }
        .unit { font-size: 0.4em; color: #64748b; font-weight: normal; }
        
        @keyframes pulse { from { box-shadow: 0 0 10px #ef444444; } to { box-shadow: 0 0 25px #ef4444aa; } }
        #hazards { color: #10b981; font-size: 1.5em; }
        .card.alert #hazards { color: #ef4444; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👷‍♂️ silentStack Command Center</h1>
        <div class="status-bar">
            Helmet: <span id="status" class="status-badge">OFFLINE</span> 
            &nbsp;|&nbsp; Last Seen: <span id="last_seen" style="color: #f8fafc;">-</span> 
            &nbsp;|&nbsp; Worker ID: <strong id="worker_id" style="color: #38bdf8;">-</strong>
        </div>
    </div>
    
    <div class="grid">
        <div class="card" id="card_temp">
            <div class="label">Internal Temp</div>
            <div class="val"><span id="temp">0.0</span><span class="unit">°C</span></div>
        </div>
        <div class="card" id="card_hum">
            <div class="label">Humidity</div>
            <div class="val"><span id="hum">0.0</span><span class="unit">%</span></div>
        </div>
        <div class="card" id="card_gas">
            <div class="label">Combustible Gas (Dev)</div>
            <div class="val"><span id="gas">0.0</span><span class="unit">%</span></div>
        </div>
        <div class="card" id="card_gforce">
            <div class="label">IMU G-Force</div>
            <div class="val"><span id="gforce">1.0</span><span class="unit">G</span></div>
        </div>
        <div class="card" style="grid-column: 1 / -1; text-align: center; border-left-color: #10b981;" id="card_hazards">
            <div class="label">Active Hazards</div>
            <div class="val" id="hazards">SYSTEM SECURE</div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                let res = await fetch('/status');
                let data = await res.json();
                
                let statusBadge = document.getElementById('status');
                statusBadge.innerText = data.status;
                if(data.status === "ONLINE") {
                    statusBadge.style.background = "#10b981";
                } else {
                    statusBadge.style.background = "#64748b";
                }

                document.getElementById('last_seen').innerText = data.last_seen;
                document.getElementById('worker_id').innerText = data.worker_id;
                
                document.getElementById('temp').innerText = data.temp.toFixed(1);
                document.getElementById('hum').innerText = data.hum.toFixed(1);
                document.getElementById('gas').innerText = data.gas_dev_pct.toFixed(1);
                document.getElementById('gforce').innerText = data.g_force.toFixed(2);
                
                let hazards = document.getElementById('hazards');
                let hazardCard = document.getElementById('card_hazards');
                
                if (data.active_alerts && data.active_alerts.length > 0) {
                    hazards.innerText = "⚠️ " + data.active_alerts.join(' + ') + " ⚠️";
                    hazardCard.classList.add('alert');
                } else {
                    hazards.innerText = "SYSTEM SECURE";
                    hazardCard.classList.remove('alert');
                    hazardCard.style.borderLeftColor = "#10b981";
                }
            } catch(e) {
                console.error("Dashboard disconnected", e);
            }
        }
        setInterval(fetchStatus, 500); // Super-fast 500ms polling for real-time safety feel
    </script>
</body>
</html>
